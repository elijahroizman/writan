[package]
name = "office-wasm"
description = "The document engine for the app, as WebAssembly: Word, PowerPoint, Excel and CSV documents opened, drawn, edited and saved"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
office-core.workspace = true
office-engine.workspace = true
office-word.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.129"
js-sys = { version = "=0.3.106", default-features = false }
office-slides.workspace = true
office-sheets.workspace = true

[dev-dependencies]
office-ppt-wasm = { path = "../office-ppt-wasm" }
