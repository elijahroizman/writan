# The office compiler: one library that reads and writes Word, PowerPoint, Excel and CSV.
# Kept apart from src-tauri, which has its own lock file and target/ (the release builds use them).
# See docs/internals/office-compiler.md.
[workspace]
resolver = "2"
members = ["office-core", "office-engine", "office-pdf", "office-pdf-wasm", "office-sheets", "office-slides", "office-wasm", "office-word"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
quick-xml = "0.42"
# Same major version and backend as src-tauri, so the app builds one copy.
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
office-core = { path = "office-core" }
office-engine = { path = "office-engine" }
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
office-word = { path = "office-word" }
office-slides = { path = "office-slides" }
office-sheets = { path = "office-sheets" }
office_oxide = "0.1.16"
office-pdf = { path = "office-pdf" }
pdf-writer = "0.15"
subsetter = { version = "0.2", default-features = false }
rustybuzz = "0.20"
ttf-parser = "0.25"
lopdf = { version = "0.43", default-features = false }
flate2 = "1"
png = "0.18"
svgtypes = "0.16"
unicode-segmentation = "1"
unicode-script = "0.5"
jpeg-decoder = { version = "0.3", default-features = false }
csscolorparser = { version = "0.8", default-features = false, features = ["named-colors"] }

# The app's engine is built from here for WebAssembly (office-wasm): fast code matters more
# than a few hundred kilobytes.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
