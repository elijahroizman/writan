name: Release

# A stable release. Builds the Windows (x64) installer, the macOS disk images (one for Apple
# silicon, one for Intel), and the Linux packages for x86_64 and ARM64: a .deb for Debian and
# Ubuntu, an .rpm for Fedora and a .pkg.tar.zst for Arch Linux (and Arch Linux ARM and Omarchy).
# It attaches them to a GitHub Release. Push a tag like v1.0.0 to publish one. Running it from the
# Actions tab only builds (and signs and notarizes), unless "publish" is ticked. The builds are
# build.yml, which the Nightly workflow (nightly.yml) calls too.
# Once the builds are done the updater-feed job publishes latest.json, which installed copies
# check for updates (see plugins.updater in src-tauri/tauri.conf.json), and the nightly-feed job
# writes it to the nightly feed too when it's newer. Linux packages have no update bundle (Tauri's updater can't
# replace a package-managed install), so latest.json doesn't list them. Once both have built, the
# linux-repos job publishes an APT, a dnf and a pacman repository holding both architectures,
# which the packages add to the system. Nightlies never go into those repositories.
# The release notes are the version's section of CHANGELOG.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release for the version in tauri.conf.json
        type: boolean
        default: false
  push:
    # Nightly pre-releases are tagged v1.1.0-nightly-2026-11-28-0930 by the Nightly workflow
    # (v1.1.0-nightly.202611280930 before).
    tags: ['v*', '!v*-nightly-*', '!v*-nightly.*']

permissions:
  contents: write

# A tag and a manual publish can target the same draft from different refs.
concurrency:
  group: writan-release-${{ (github.event_name == 'push' || inputs.publish) && 'publish' || github.run_id }}
  queue: max

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Release notes
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          section="$(awk -v v="$version" '/^## /{ if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } } found' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$section"
            echo "Earlier versions: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${version}/CHANGELOG.md). How to install: [README](https://github.com/${GITHUB_REPOSITORY}#install)."
          } > "$RUNNER_TEMP/notes.md"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Create or resume the draft
        id: draft
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Writan $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          release="$(gh release view "$TAG" --json databaseId,isDraft)"
          if ! jq -e '.isDraft' <<< "$release" > /dev/null; then
            echo "::error::$TAG is already public; refusing to replace live update assets."
            exit 1
          fi
          echo "id=$(jq -r .databaseId <<< "$release")" >> "$GITHUB_OUTPUT"

  build:
    # The builds themselves are in build.yml, which the Nightly workflow calls too.
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
    secrets: inherit

  updater-feed:
    # latest.json, the feed installed Mac and Windows copies check (plugins.updater.endpoints in
    # src-tauri/tauri.conf.json), written once from the update bundles and signatures the build
    # jobs uploaded (scripts/update-feed.sh). A failed build leaves the draft private and the
    # previous feed live. Once the release is public a rerun leaves it alone, so the nightly-feed
    # job after it can be rerun on its own.
    name: Update feed
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload the complete feed, then publish the release
        id: publish
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
            echo "$tag is public already; leaving its feed as it is."
            exit 0
          fi
          scripts/update-feed.sh "$tag" "$version" "$RUNNER_TEMP"
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/latest.json" --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false

  nightly-feed:
    # The release's latest.json goes to the nightly feed too when this release is newer than the
    # version there, so copies on the nightly channel move onto it (scripts/promote-feed.sh). Only
    # when it's newer: a maintenance release for an older version would otherwise take nightly
    # copies off their newer build, though the updater wouldn't install it. The Nightly workflow's
    # feed job shares the concurrency group, so a nightly that finishes after this can't put an
    # older version back. Each workflow runs one at a time, so the group holds one job from each at
    # most, and a waiting one is never replaced by a newer one. Rerunning it is safe.
    name: Nightly feed
    needs: updater-feed
    runs-on: ubuntu-24.04
    concurrency:
      group: writan-update-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.updater-feed.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Point the nightly feed at this release
        run: scripts/promote-feed.sh "$TAG"

  linux-repos:
    # Publishes the APT, dnf and pacman repositories once both Linux jobs have built. It runs when
    # another job (the Mac or Windows one) failed too, so Linux copies still get the release, and
    # fails if either Linux artifact is missing. All three repositories are signed with the same key
    # (APT_SIGNING_KEY; its public half is src-tauri/linux/writan-archive-keyring.gpg, and
    # RPM-GPG-KEY-writan armored). Each puts the packages up first, then the index, then the
    # signature over it, so a client never sees an index pointing at a file that isn't there yet.
    name: Linux repositories
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c zstd
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Check both architectures built
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          ls -l
          for name in '*_amd64.deb' '*_arm64.deb' '*.x86_64.rpm' '*.aarch64.rpm' '*-x86_64.pkg.tar.zst' '*-aarch64.pkg.tar.zst'; do
            set -- $name
            if [ "$#" -ne 1 ] || [ ! -e "$1" ]; then
              echo "expected one $name"
              exit 1
            fi
          done
      - name: Signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$home"
          printf '%s\n' "$APT_SIGNING_KEY" | GNUPGHOME="$home" gpg --batch --import
          echo "GNUPGHOME=$home" >> "$GITHUB_ENV"
      - name: Publish the APT repository
        # A flat APT repository in the assets of the release tagged "apt" (a pre-release, so the
        # updater and the app's "latest release" never pick it), with the amd64 and arm64 packages
        # in one index. The .deb's postinst points /etc/apt/sources.list.d/writan.list there,
        # signed-by the key it installs.
        #
        # apt upgrade does not install a package that is not already installed, and the Update
        # button shipped before the rename runs `apt-get install --only-upgrade workspace`.
        # This step also publishes an empty package named workspace that depends on writan, at
        # the same version. Upgrading that name pulls writan in. Origin and Label stay Workspace.
        # Changing them makes apt-get update on already-installed copies stop until someone passes
        # --allow-releaseinfo-change, and the shipped Update button does not pass it.
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/packages/*.deb)
          version="$(dpkg-deb -f "${debs[0]}" Version)"
          maintainer="$(dpkg-deb -f "${debs[0]}" Maintainer)"
          repo="$RUNNER_TEMP/apt"
          mkdir -p "$repo"
          cp "${debs[@]}" "$repo/"
          empty="$(mktemp -d)"
          mkdir -p "$empty/DEBIAN"
          cat > "$empty/DEBIAN/control" <<EOF
          Package: workspace
          Version: ${version}
          Architecture: all
          Maintainer: ${maintainer}
          Installed-Size: 0
          Depends: writan
          Section: oldlibs
          Priority: optional
          Description: Transitional package for Writan
           The Linux package was renamed from workspace to writan. This empty package
           depends on writan so apt upgrade installs the new name.
          EOF
          dpkg-deb --root-owner-group --build "$empty" "$repo/workspace_${version}_all.deb"
          rm -rf "$empty"
          cd "$repo"
          # Asset names can't hold a path, so the index names the file alone.
          apt-ftparchive packages . | sed 's|^Filename: \./|Filename: |' > Packages
          gzip -9kn Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Workspace \
            -o APT::FTPArchive::Release::Label=Workspace \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64" \
            -o APT::FTPArchive::Release::Description="Writan (github.com/${GITHUB_REPOSITORY})" \
            release . > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          if ! gh release view apt -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create apt -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "APT repository" \
              --notes "Writan's APT repository for Debian and Ubuntu. The .deb adds it for you; nothing here needs downloading by hand."
          fi
          gh release upload apt -R "$GITHUB_REPOSITORY" *.deb --clobber
          gh release upload apt -R "$GITHUB_REPOSITORY" Packages Packages.gz --clobber
          gh release upload apt -R "$GITHUB_REPOSITORY" Release Release.gpg InRelease --clobber
          # Keep the two newest real packages of each architecture and the two newest transitional
          # packages, for anyone whose index is a step behind. Sort by the version field, not the
          # whole name, so Workspace_0.10.4 and Writan_0.10.5 compare as versions.
          prune_apt() {
            local pattern="$1"
            local names old
            names="$(gh release view apt -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E "$pattern" || true)"
            [ -n "$names" ] || return 0
            old="$(printf '%s\n' "$names" | sort -t_ -k2,2V | head -n -2 || true)"
            for name in $old; do
              gh release delete-asset apt "$name" -R "$GITHUB_REPOSITORY" --yes
            done
          }
          prune_apt '^(Writan|Workspace)_.+_amd64\.deb$'
          prune_apt '^Writan_.+_arm64\.deb$'
          prune_apt '^workspace_.+_all\.deb$'
      - name: Publish the dnf repository
        # A dnf repository at https://github.com/<repo>/releases/download/rpm/, which src-tauri/linux/rpm-postinst
        # adds to /etc/yum.repos.d. dnf reads <baseurl>/repodata/… and the index points packages at
        # packages/…, and GitHub serves tags with a slash, so the metadata is the assets of the
        # pre-release tagged "rpm/repodata" and the .rpm files those of "rpm/packages". One index
        # lists the x86_64 and aarch64 packages, and dnf picks its machine's. repomd.xml is signed
        # (repo_gpgcheck); it lists the other files' checksums and they list the packages', so the
        # one signature covers the lot.
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo="$RUNNER_TEMP/dnf"
          mkdir -p "$repo/packages"
          cp "$RUNNER_TEMP"/packages/*.rpm "$repo/packages/"
          cd "$repo"
          rpms=(packages/*.rpm)
          createrepo_c --no-database --general-compress-type=gz .
          gpg --batch --yes --armor --detach-sign -o repodata/repomd.xml.asc repodata/repomd.xml
          for tag in rpm/packages rpm/repodata; do
            if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "dnf repository (${tag#rpm/})" \
                --notes "Part of Writan's dnf repository for Fedora. The .rpm adds it for you; nothing here needs downloading by hand."
            fi
          done
          gh release upload rpm/packages -R "$GITHUB_REPOSITORY" "${rpms[@]}" --clobber
          meta=(repodata/*.xml.gz)
          gh release upload rpm/repodata -R "$GITHUB_REPOSITORY" "${meta[@]}" --clobber
          gh release upload rpm/repodata -R "$GITHUB_REPOSITORY" repodata/repomd.xml repodata/repomd.xml.asc --clobber
          # Drop metadata the new repomd.xml doesn't name, and keep the new .rpm of each architecture
          # and the one before it.
          for name in $(gh release view rpm/repodata -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            case "$name" in repomd.xml | repomd.xml.asc) continue ;; esac
            [ -e "repodata/$name" ] || gh release delete-asset rpm/repodata "$name" -R "$GITHUB_REPOSITORY" --yes
          done
          for arch in x86_64 aarch64; do
            new="$(basename packages/*."$arch".rpm)"
            # Sort by the version field so Workspace-0.10.4 and Writan-0.10.5 compare as versions.
            old="$(gh release view rpm/packages -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E "^(Writan|Workspace)-.+\.${arch}\.rpm\$" | grep -vxF "$new" | sort -t- -k2,2V | head -n -1 || true)"
            for name in $old; do
              gh release delete-asset rpm/packages "$name" -R "$GITHUB_REPOSITORY" --yes
            done
          done
      - name: Publish the pacman repository
        # One pacman repository per architecture, in the assets of the pre-releases tagged
        # "arch/x86_64" and "arch/aarch64": pacman.conf's `Server = …/download/arch/$arch` reads
        # writan.db there. The Arch package's install script adds that section and puts the key in
        # pacman's keyring, and `SigLevel = Required` makes pacman check the detached signature
        # (<file>.sig) on the database and on each package. scripts/pacman-repo.sh writes the
        # database. The app's Update button downloads the package file and its signature, checks
        # them against the key, and installs the file with `pacman -U` (src-tauri/linux/pacman-install.sh).
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            repo="$RUNNER_TEMP/pacman/$arch"
            mkdir -p "$repo"
            cp "$RUNNER_TEMP"/packages/*-"$arch".pkg.tar.zst "$repo/"
            pkg="$(basename "$repo"/*.pkg.tar.zst)"
            gpg --batch --yes --detach-sign -o "$repo/$pkg.sig" "$repo/$pkg"
            db="$(scripts/pacman-repo.sh "$repo")"
            gpg --batch --yes --detach-sign -o "$db.sig" "$db"
            tag="arch/$arch"
            if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "pacman repository ($arch)" \
                --notes "Writan's pacman repository for Arch Linux ($arch). The package adds it for you; nothing here needs downloading by hand."
            fi
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$repo/$pkg" "$repo/$pkg.sig" --clobber
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" "$db" "$db.sig" --clobber
            # Keep the new package and the one before it, for anyone whose database is a step behind.
            old="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -E "^writan-.+-${arch}\.pkg\.tar\.zst\$" | grep -vxF "$pkg" | sort -t- -k2,2V | head -n -1 || true)"
            for name in $old; do
              gh release delete-asset "$tag" "$name" -R "$GITHUB_REPOSITORY" --yes
              gh release delete-asset "$tag" "$name.sig" -R "$GITHUB_REPOSITORY" --yes || true
            done
          done
