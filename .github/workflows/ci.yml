name: CI

# Checks changed components on pull requests, and everything on main or manual runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      app: ${{ steps.filter.outputs.app }}
      frontend: ${{ steps.filter.outputs.frontend }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Compare locally without pull-requests API permissions.
          token: ''
          filters: |
            engine:
              - 'crates/**'
              - 'src/engine/slides/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            app:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            packaging:
              - 'scripts/arch-package.sh'
              - 'scripts/pacman-repo.sh'
              - 'scripts/debian-repack.sh'
              - 'scripts/check-linux-packages.sh'
              - 'scripts/check-debian-repack.py'
              - 'src-tauri/linux/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'plugins/**'
              - 'scripts/**'
              - 'public/**'
              - 'tests/stress/ui/**'
              - 'tests/stress/native/**'
              - 'tests/stress/samples/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'crates/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  engine:
    name: Engine format, lint, test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The core works on bytes only, so the browser version can use it too.
      - run: cargo build -p office-core --target wasm32-unknown-unknown
      - run: cargo build -p office-wasm --target wasm32-unknown-unknown
      - run: cargo build -p office-pdf-wasm --target wasm32-unknown-unknown

  engine-samples:
    name: Real files, and other apps opening ours
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: LibreOffice packages
        # A real install with the downloads cached, not a cache of the installed files: that only
        # holds the packages missing from the runner image it was made on, so it breaks when the
        # image drops one.
        uses: ./.github/actions/apt-install
        with:
          name: libreoffice
          run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui
      - name: Python libraries
        run: python3 -m pip install --user --break-system-packages python-docx python-pptx openpyxl
      - name: Generate samples with headless LibreOffice
        run: |
          command -v soffice
          soffice --headless --version
          python3 samples.py "$RUNNER_TEMP/samples"
          for sample in pydocx.docx pypptx.pptx openpyxl.xlsx sample.xlsx; do
            test -s "$RUNNER_TEMP/samples/lo/$sample"
          done
      - run: cargo test --workspace --all-features
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples
      - run: cargo test --workspace --all-features -- --ignored
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples

  engine-windows:
    name: Engine test on Windows
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true'
    # Windows checkouts use CRLF line endings, which once hid every shape preset in release builds.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo test -p office-engine

  app:
    name: App lint and test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Linux build dependencies
        uses: ./.github/actions/apt-install
        with:
          name: app
          run: sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app-native:
    name: App check on macOS and Windows
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      # Sockets behave differently here: on Windows a cloned socket's timeouts don't reach the
      # original, which once kept shared documents from connecting at all.
      - run: cargo test --lib collab

  frontend:
    name: Frontend build and browser tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - run: VITE_TEST_HOOKS=1 npm run build
      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      # Playwright's system packages (fonts, mostly) through the apt cache, then the browser.
      - name: Playwright system packages
        uses: ./.github/actions/apt-install
        with:
          name: playwright
          update: 'false'
          run: npx playwright install-deps chromium
      - run: npx playwright install chromium
      - name: Cache offline OCR language packs
        uses: actions/cache@v4
        with:
          path: .cache/tessdata
          key: tessdata-fast-87416418657359cb625c412a48b6e1d6d41c29bd-eng-heb-ara-v1
      - name: Fetch verified OCR packs for CI
        run: |
          mkdir -p .cache/tessdata
          BASE="https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd"
          verify_pack() {
            local code="$1" expected="$2"
            local file=".cache/tessdata/${code}.traineddata"
            if [ ! -f "$file" ] || [ "$(sha256sum "$file" | cut -d' ' -f1)" != "$expected" ]; then
              curl -fsSL "$BASE/${code}.traineddata" -o "${file}.tmp"
              echo "${expected}  ${file}.tmp" | sha256sum -c -
              mv "${file}.tmp" "$file"
            fi
          }
          verify_pack eng 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          verify_pack heb 11f9e43ab227f786352a50f75c94c2e9906f1baba86d93276da19da7ce0904db
          verify_pack ara e3206d3dc87fd50c24a0fb9f01838615911d25168f4e64415244b67d2bb3e729
      - run: npm run test:browser
      # The fixed large-document/sheet corpus runs in the same production build. Timing budgets are
      # deliberately loose enough not to flap on a shared runner; the startup byte budget is the
      # tight regression signal for preload/bundle weight.
      - name: Performance corpus
        run: npm run perf
        env:
          PERF_BUDGET_STARTUP_BYTES: "600000"
          PERF_BUDGET_OPEN_MS: "8000"
          PERF_BUDGET_PAINT_MS: "8000"
          PERF_BUDGET_KEY_MS: "30"
      - name: Run offline OCR accuracy checks
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/vite-ocr-preview.log 2>&1 &
          PID=$!
          trap "kill $PID || true" EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          WRITAN_URL=http://127.0.0.1:4173/ node tests/stress/ui/offline-ocr-accuracy.mjs

  packaging:
    name: Linux packages
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/check-linux-packages.sh

  ci:
    name: ci
    needs: [changes, engine, engine-samples, engine-windows, app, app-native, frontend, packaging]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check component results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
