name: CI

# Checks changed components on pull requests, and everything on main or manual runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      app: ${{ steps.filter.outputs.app }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # Compare locally without pull-requests API permissions.
          token: ''
          filters: |
            engine:
              - 'crates/**'
              - 'src/engine/slides/**'
              - '.github/workflows/ci.yml'
            app:
              - 'src-tauri/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'plugins/**'
              - 'scripts/**'
              - 'public/**'
              - 'tests/stress/ui/**'
              - 'tests/stress/native/**'
              - 'tests/stress/samples/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vite.config.ts'
              - 'crates/**'
              - '.github/workflows/ci.yml'

  engine:
    name: Engine format, lint, test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The core works on bytes only, so the browser version can use it too.
      - run: cargo build -p office-core --target wasm32-unknown-unknown
      - run: cargo build -p office-wasm --target wasm32-unknown-unknown

  engine-samples:
    name: Real files, and other apps opening ours
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Refresh package index
        run: sudo apt-get update
      - name: LibreOffice packages
        # A plain install, not a cache of the .debs: a cache only holds the packages that were
        # missing from the runner image it was made on, so it breaks when the image drops one.
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-impress-nogui libreoffice-calc-nogui
      - name: Python libraries
        run: python3 -m pip install --user --break-system-packages python-docx python-pptx openpyxl
      - name: Generate samples with headless LibreOffice
        run: |
          command -v soffice
          soffice --headless --version
          python3 samples.py "$RUNNER_TEMP/samples"
          for sample in pydocx.docx pypptx.pptx openpyxl.xlsx sample.xlsx; do
            test -s "$RUNNER_TEMP/samples/lo/$sample"
          done
      - run: cargo test --workspace --all-features
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples
      - run: cargo test --workspace --all-features -- --ignored
        env:
          OFFICE_SAMPLES: ${{ runner.temp }}/samples

  app:
    name: App lint and test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Refresh package index
        run: sudo apt-get update
      - name: Linux build dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev
          # Bump only when the package list changes.
          version: ubuntu-24.04-app-1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  app-native:
    name: App check on macOS and Windows
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings

  frontend:
    name: Frontend build and browser tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      - run: VITE_TEST_HOOKS=1 npm run build
      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  ci:
    name: ci
    needs: [changes, engine, engine-samples, app, app-native, frontend]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check component results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"
