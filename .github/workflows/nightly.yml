name: Nightly

# A nightly: main built for every platform the Release workflow builds (build.yml), as a
# pre-release of the next minor version, <major>.<minor + 1>.0-nightly.<UTC date and time> after
# the latest published stable release, for example 1.1.0-nightly.202611280930 after 1.0.0 or a
# 1.0.1 hotfix. That sorts after the stable release it follows and before the next minor one, so
# a nightly copy moves onto that release by itself. A stable tag whose release hasn't published
# doesn't count: a nightly built while v1.1.0's build is failing stays a 1.1.0 nightly, which
# 1.1.0 replaces in the nightly feed once it's out. Same app ID and signing as a stable release,
# so a copy switches channel in place.
#
# The updaters compare that version, so it goes into tauri.conf.json, latest.json and the
# packages. Everything people see uses one name built from it (scripts/nightly.mjs): the tag
# v1.1.0-nightly-2026-11-28-0930, the title "Writan Nightly v1.1.0 2026-11-28 09:30 UTC", and
# file names like Writan_1.1.0-nightly-2026-11-28-0930_x64.dmg.
#
# Run it whenever something new lands on main:
#
#   gh workflow run nightly.yml --ref main
#
# It publishes a GitHub pre-release with that tag holding the installers, the update bundles
# and the Linux packages, with notes listing the PR titles merged since the previous nightly or
# stable tag, grouped by type (scripts/nightly.mjs), after the "notes" input, and deletes all but
# the newest 10 nightlies. Then the feed job points the nightly update feed (latest.json on the
# pre-release tagged "nightly") at it, unless the feed already has a newer version. It never
# touches the stable feed or the APT, dnf and pacman repositories. Linux copies on the nightly
# channel install the packages from the pre-release: the .deb and .rpm are signed with the
# updater key (`tauri signer sign`), the Arch package with the repositories' key
# (APT_SIGNING_KEY), as pacman expects.
#
# Untick "publish" to build without publishing anything.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Notes for this nightly, shown above the list of changes
        type: string
        default: ''
      publish:
        description: Publish the nightly (untick to only build)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: writan-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare nightly
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      label: ${{ steps.version.outputs.label }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Only from main
        # A build-only run (publish unticked) can test a branch.
        if: github.ref != 'refs/heads/main' && inputs.publish
        run: |
          echo "::error::Nightlies publish from main: gh workflow run nightly.yml --ref main"
          exit 1
      - uses: actions/checkout@v4
        with:
          # The tags give where the list of changes starts.
          fetch-depth: 0
          persist-credentials: false
      - name: Version and notes
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          # The published stable releases, which the version follows: a stable tag whose release
          # is still a draft, or failed, doesn't count (scripts/nightly.mjs).
          STABLE_RELEASES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name')"
          export STABLE_RELEASES
          # version, tag, label and title, all from the same minute.
          node scripts/nightly.mjs names > "$RUNNER_TEMP/names"
          cat "$RUNNER_TEMP/names"
          cat "$RUNNER_TEMP/names" >> "$GITHUB_OUTPUT"
          grep -E '^(tag|title)=' "$RUNNER_TEMP/names" | sed -E 's/^tag=/TAG=/; s/^title=/TITLE=/' >> "$GITHUB_ENV"
          node scripts/nightly.mjs notes > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft
        id: draft
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A draft has no tag yet, so a nightly that fails leaves the next one's list of changes
          # starting where this one's did.
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          release="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId,isDraft)"
          if ! jq -e '.isDraft' <<< "$release" > /dev/null; then
            echo "::error::$TAG is already public."
            exit 1
          fi
          echo "id=$(jq -r .databaseId <<< "$release")" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  publish:
    # Runs only when every build passed. A failed build leaves the draft private and the feed
    # on the previous nightly; rerun the failed jobs. Once the nightly is public, a rerun skips
    # straight to the pruning, so a later step or the feed job can be rerun on its own.
    name: Publish nightly
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      LABEL: ${{ needs.prepare.outputs.label }}
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Draft or public
        id: state
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          [ "$draft" = true ] || echo "$TAG is public already; leaving its files as they are."
      - uses: actions/download-artifact@v4
        if: steps.state.outputs.draft == 'true'
        with:
          pattern: linux-*
          path: ${{ runner.temp }}/packages
          merge-multiple: true
      - name: Name the Linux packages
        if: steps.state.outputs.draft == 'true'
        # From the names the build gives them, which hold each format's own version, to the
        # nightly's name, which src-tauri/src/update.rs (nightly_package_url) downloads. Before
        # signing: the app checks the file name a signature was made for.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          ls -l
          base="${VERSION%%-*}"
          stamp="${VERSION##*.}"
          # Built name, then published name.
          files=(
            "Writan_${VERSION}_amd64.deb" "Writan_${LABEL}_amd64.deb"
            "Writan_${VERSION}_arm64.deb" "Writan_${LABEL}_arm64.deb"
            "Writan-${base}-0.nightly.${stamp}.x86_64.rpm" "Writan_${LABEL}_x86_64.rpm"
            "Writan-${base}-0.nightly.${stamp}.aarch64.rpm" "Writan_${LABEL}_aarch64.rpm"
            "writan-${base}nightly.${stamp}-1-x86_64.pkg.tar.zst" "Writan_${LABEL}_x86_64.pkg.tar.zst"
            "writan-${base}nightly.${stamp}-1-aarch64.pkg.tar.zst" "Writan_${LABEL}_aarch64.pkg.tar.zst"
          )
          for ((i = 0; i < ${#files[@]}; i += 2)); do
            if [ ! -s "${files[i]}" ]; then
              echo "::error::Missing ${files[i]}"
              exit 1
            fi
          done
          [ "$(dpkg-deb -f "Writan_${VERSION}_amd64.deb" Version)" = "${base}~nightly.${stamp}" ]
          for ((i = 0; i < ${#files[@]}; i += 2)); do
            mv -- "${files[i]}" "${files[i + 1]}"
          done
          ls -l
      - name: Sign the .deb and .rpm packages
        if: steps.state.outputs.draft == 'true'
        # With the updater key, which the app checks them against before apt or dnf installs one.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cli="$(node -p "require('./package-lock.json').packages['node_modules/@tauri-apps/cli'].version")"
          for file in "$RUNNER_TEMP"/packages/*.deb "$RUNNER_TEMP"/packages/*.rpm; do
            npx --yes "@tauri-apps/cli@$cli" signer sign "$file"
          done
      - name: Sign the Arch packages
        if: steps.state.outputs.draft == 'true'
        # With the repositories' key, which the Arch package installs. The app downloads <file>.sig
        # with the package and checks it against that key (src-tauri/linux/pacman-install.sh).
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          for file in "$RUNNER_TEMP"/packages/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign -o "$file.sig" "$file"
          done
          gpgconf --kill gpg-agent 2> /dev/null || true
          rm -rf "$GNUPGHOME"
      - name: Upload the Linux packages
        if: steps.state.outputs.draft == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/packages"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" ./*.deb ./*.rpm ./*.pkg.tar.zst ./*.sig --clobber
      - name: Name the Mac and Windows files
        # tauri-action names them after the SemVer version (Writan_1.1.0-nightly.202611280930_x64.dmg);
        # they take the nightly's name instead (Writan_1.1.0-nightly-2026-11-28-0930_x64.dmg).
        # The Windows installer and its signature go together, and latest.json lists the new
        # names. A build job rerun after this uploads under the old name again, and that newer
        # copy replaces the renamed one. The update bundles' signatures don't hold a file name the
        # updater checks, so renaming leaves them valid.
        if: steps.state.outputs.draft == 'true'
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' > "$RUNNER_TEMP/assets.tsv"
          mapfile -t assets < "$RUNNER_TEMP/assets.tsv"
          for asset in "${assets[@]}"; do
            IFS=$'\t' read -r id name <<< "$asset"
            case "$name" in
              *"_${VERSION}_"*) ;;
              *) continue ;;
            esac
            new="${name/"_${VERSION}_"/"_${LABEL}_"}"
            old="$(awk -F '\t' -v n="$new" '$2 == n { print $1 }' "$RUNNER_TEMP/assets.tsv")"
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            fi
            echo "$name -> $new"
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" --silent
          done
      - name: Publish the nightly
        # Its latest.json goes up first, and the feed job copies it to the nightly feed once the
        # pre-release is public, since the URLs in it only download then.
        if: steps.state.outputs.draft == 'true'
        run: |
          set -euo pipefail
          scripts/update-feed.sh "$TAG" "$VERSION" "$RUNNER_TEMP" "$LABEL"
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$RUNNER_TEMP/latest.json" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Keep the newest 10 nightlies
        # Older nightlies and their tags go, along with drafts left by runs that failed. The
        # stamp orders them by build time. Tags like v1.1.0-nightly-2026-11-28-0930, and the
        # earlier v1.0.1-nightly.202611280930, whose stamp is the same 12 digits.
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly(\\.[0-9]{12}|-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4})$")) | [(.tag_name | sub("^.*-nightly[-.]"; "") | gsub("-"; "")), .tag_name, .draft] | @tsv' \
            | sort -r > "$RUNNER_TEMP/nightlies.tsv"
          kept=0
          while IFS=$'\t' read -r _ tag draft; do
            if [ "$draft" = true ]; then
              [ "$tag" = "$TAG" ] || gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes
            elif [ "$kept" -lt 10 ]; then
              kept=$((kept + 1))
            else
              gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done < "$RUNNER_TEMP/nightlies.tsv"

  feed:
    # Points the nightly feed at this nightly unless it has a newer version, such as a stable
    # release published while this built (scripts/promote-feed.sh). The Release workflow's feed
    # job shares the concurrency group, so the two never read and write the feed at once. Each
    # workflow runs one at a time, so the group holds one job from each at most, and a waiting one
    # is never replaced by a newer one. Rerunning it is safe.
    name: Nightly feed
    needs: [prepare, publish]
    if: inputs.publish
    runs-on: ubuntu-24.04
    concurrency:
      group: writan-update-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Point the nightly feed at this nightly
        run: scripts/promote-feed.sh "$TAG"
