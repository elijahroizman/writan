name: PR title

# PR titles follow Conventional Commits, `type(scope): summary` or `type: summary`, with a `!`
# before the colon for a breaking change: `fix(excel): keep merged cells on paste`,
# `feat(pdf)!: drop the old signature format`. The scope is optional and lowercase. PRs are
# squash-merged with the title as the commit subject, and the nightly notes group those subjects
# by type (scripts/nightly.mjs). Release PRs are `chore(release): 1.0.0`.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style'
          if printf '%s' "$TITLE" | grep -Eqx "($types)(\([a-z0-9][a-z0-9-]*\))?!?: [^ ].*"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::The PR title must be 'type(scope): summary' or 'type: summary', with type one of ${types//|/, } and an optional lowercase scope, for example 'fix(excel): keep merged cells on paste'. It is: $TITLE"
          exit 1
